[project]
name = "ai-language-buddy"
version = "0.1.0"
description = "AI Language Buddy API"
requires-python = ">=3.13"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "asyncpg==0.31.0",
    "bcrypt==5.0.0",
    "click==8.5.0",
    "dnspython==2.8.0",
    "email-validator==2.3.0",
    "fastapi==0.142.2",
    "greenlet==3.5.6",
    "h11==0.16.0",
    "idna==3.20",
    "opentelemetry-api==1.45.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pydantic_core==2.46.5",
    "python-dotenv==1.2.4",
    "sqlalchemy==2.1.3",
    "starlette==1.7.0",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
